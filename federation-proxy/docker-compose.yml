# ClawDeck Federation Proxy
# Run this on each remote machine you want to add to ClawDeck Federation
#
# Setup:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up -d

services:
  federation-proxy:
    build: .
    container_name: clawdeck-federation-proxy
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PROXY_PORT:-18790}:18790"
    environment:
      - FEDERATION_TOKEN=${FEDERATION_TOKEN}
      - GATEWAY_URL=${GATEWAY_URL:-http://host.docker.internal:18789}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - BIND_HOST=0.0.0.0
      - PROXY_PORT=18790
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - AUDIT_LOG=${AUDIT_LOG:-true}
      - LOG_DIR=/app/logs
    volumes:
      - federation-proxy-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:18790/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  federation-proxy-logs:
